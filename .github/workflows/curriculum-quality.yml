name: Curriculum Quality Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  curriculum-smoke:
    name: audit + numerical lesson tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal lesson test dependency
        run: python -m pip install "numpy>=1.24,<3"
      - name: Audit file pairing
        run: python scripts/audit_curriculum.py
      - name: Compile pilot scripts and tests
        run: |
          python -m py_compile scripts/audit_curriculum.py
          python -m py_compile tests/test_audit_curriculum.py tests/test_ch1_curve_fitting.py
          python -m py_compile "1_Introduction/1.2_Probability_Theory/04_1.2.5_Curve_fitting_re_visited.py"
          python -m py_compile main.py
          python -m py_compile prml/__init__.py prml/supervised.py prml/bayesian_classification.py tests/test_v02_supervised.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify destructive generator is opt-in
        run: |
          if python main.py; then
            echo "ERROR: Generator should refuse invocation without a destination" >&2
            exit 1
          fi
